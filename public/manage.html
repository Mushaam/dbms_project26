<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage · Museum Lifecycle</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">Museum Lifecycle</div>
    <nav>
      <a href="/index.html">Reports</a>
      <a class="active" href="/manage.html">Manage Data</a>
      <button type="button" class="secondary" id="logout-btn">Logout</button>
    </nav>
    <div class="user-chip" id="user-chip"></div>
  </header>

  <main>
    <h1>Database Management</h1>
    <p class="lead">View, add, edit, and delete core entity records.</p>

    <div class="tabs" id="entity-tabs">
      <button type="button" data-entity="artifacts" class="active">Artifacts</button>
      <button type="button" data-entity="exhibitions">Exhibitions</button>
      <button type="button" data-entity="loans">Loans</button>
      <button type="button" data-entity="conservation">Conservation</button>
      <button type="button" data-entity="insurance">Insurance</button>
    </div>

    <section class="panel">
      <h2 id="form-title">Add Artifact</h2>
      <form id="entity-form" class="grid-2"></form>
      <div>
        <button type="submit" form="entity-form" id="save-btn">Save</button>
        <button type="button" class="secondary" id="reset-btn">Reset</button>
      </div>
      <p id="form-msg" class="msg"></p>
    </section>

    <section class="panel">
      <h2>Records</h2>
      <p id="list-msg" class="msg"></p>
      <div id="records-table"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/manage.js"></script>
</body>
</html>
